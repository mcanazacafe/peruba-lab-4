# ─── Identificacion del proyecto ──────────────────────────────────────────
sonar.projectKey=mcanazacafe_peruba-lab-4
sonar.organization=mcanazacafe

# Nombre y version mostrados en la UI de SonarCloud
sonar.projectName=peruba-lab-4
sonar.projectVersion=1.0.0

# ─── Fuentes y exclusiones ──────────────────────────────────────────────────
sonar.sources=src
sonar.tests=tests
sonar.inclusions=**/*.py
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/data/**,**/.venv/**

# ─── Cobertura (generada con pytest-cov) ────────────────────────────────────
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=tests/**,**/conftest.py,**/__init__.py

# ─── Codificacion ───────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ─── Version de Python ──────────────────────────────────────────────────────
sonar.python.version=3.13
